<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Quizzes Portal | Samvedi</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .portal-card {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      padding: 28px;
    }
    h1 { font-size: 20px; color: #1e3a8a; margin-bottom: 8px; }
    p { font-size: 14px; color: #64748b; margin-bottom: 20px; }
    .quiz-link {
      display: block;
      background: #f1f5f9;
      color: #1e293b;
      text-decoration: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 10px;
      border: 1px solid #cbd5e1;
      transition: all 0.2s;
    }
    .quiz-link:hover {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0369a1;
    }
  </style>
</head>
<body>
  <div class="portal-card">
    <h1>Clinical Quizzes Portal</h1>
    <p>Select an active quiz session to begin:</p>
    
    <a href="/derma/" class="quiz-link">
      SIG Recalcitrant Dermatophytosis Quiz &rarr;
    </a>
    
    <!-- You can add future links here as new quizzes are published:
    <a href="/cardio/" class="quiz-link">Cardiology Session Quiz &rarr;</a>
    -->
  </div>
</body>
</html>
